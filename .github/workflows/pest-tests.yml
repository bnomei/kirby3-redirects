name: Pest Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "**.php"
      - "blueprints/**"
      - "tests/panel/check"
      - "composer.lock"
  pull_request:
    paths:
      - "**.php"
      - "blueprints/**"
      - "tests/panel/check"
      - "composer.lock"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: xdebug

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install
        run: composer kirby

      - name: Test both Panel blueprints in Chromium
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
          tests/panel/check

      - name: Test & publish code coverage
        uses: paambaati/codeclimate-action@v8.0.0
        with:
          coverageCommand: tests/vendor/bin/pest --ci
          coverageLocations: ${{github.workspace}}/tests/clover.xml:clover
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
