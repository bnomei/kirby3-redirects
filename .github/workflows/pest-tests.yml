name: Pest Tests

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pest-tests.yml"
      - "**.php"
      - "blueprints/**"
      - "tests/panel/check"
      - "composer.lock"
  pull_request:
    paths:
      - ".github/workflows/pest-tests.yml"
      - "**.php"
      - "blueprints/**"
      - "tests/panel/check"
      - "composer.lock"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: xdebug

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install
        run: composer kirby

      - name: Test both Panel blueprints in Chromium
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
          tests/panel/check

      - name: Run Pest with coverage
        run: tests/vendor/bin/pest --ci --coverage-clover tests/clover.xml
        env:
          XDEBUG_MODE: coverage

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/clover.xml
          if-no-files-found: error
